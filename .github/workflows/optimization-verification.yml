name: Beythaus Cut - Optimizer Verification

on:
  push:
    branches: [master]
    paths:
      - 'docs/index.html'
      - 'docs/engine/**'
      - 'docs/optimization-worker.js'
      - 'docs/guillotine-exact.js'
      - 'docs/economic-exact.js'
      - 'tests/**'
      - '.github/workflows/optimization-verification.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/index.html'
      - 'docs/engine/**'
      - 'docs/optimization-worker.js'
      - 'docs/guillotine-exact.js'
      - 'docs/economic-exact.js'
      - 'tests/**'
      - '.github/workflows/optimization-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-optimization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify module architecture and independent production audit
        run: node tests/engine-contract.cjs
      - name: Verify analytical geometric lower bounds
        run: node tests/geometric-bounds.cjs
      - name: Verify heterogeneous 27-sheet kerf bounds and distinct exact objectives
        run: node tests/motor-heterogeneous-capacity.cjs
      - name: Verify positive-kerf mixed-stock physical strip rescue
        run: node tests/motor-mixed-strip.cjs
      - name: Verify nested residual full-edge cuts against planted witnesses
        run: MOTOR_NESTED_JSON=nested-kerf-report.json node tests/motor-nested-residual.cjs
      - name: Verify joint area and large-piece capacity bounds against independent oracles
        run: node tests/motor-paired-cover.cjs
      - name: Verify simultaneous multi-threshold area and cost bounds with independent oracle
        run: node tests/motor-multi-threshold.cjs
      - name: Verify three simultaneous size thresholds and larger independent holdouts
        run: MOTOR_TRIPLE_JSON=triple-threshold-report.json node tests/motor-triple-threshold.cjs
      - name: Verify mixed-size threshold kerf area and cost lower bounds
        run: node tests/motor-threshold-kerf.cjs
      - name: Verify fractional kerf bounds and unused independent cases
        run: node tests/motor-fractional-oracle.cjs
      - name: Diagnose independent small-job optimum proof gaps
        run: MOTOR_GAP_JSON=proof-gaps.json node tests/motor-proof-gap-census.cjs
      - name: Verify background exact Worker against reference oracle
        run: node tests/optimization-worker.cjs
      - name: Verify exact guillotine cut trees and proofs
        run: node tests/guillotine-worker.cjs
      - name: Verify real atelier PDF has full-length cuts and safe draft marking
        run: node tests/atolye-production-safety.cjs
      - name: Verify gross-area and stock-cost objectives remain independent
        run: node tests/motor-objective-separation.cjs
      - name: Verify user-selected exact objective and audited plan acceptance
        run: node tests/selected-objective-flow.cjs
      - name: Verify exact incremental stock-cost optimum
        run: node tests/economic-worker.cjs
      - name: Validate economic plan acceptance and tamper rejection
        run: node tests/economic-acceptance.cjs
      - name: Verify mobile-friendly sequential Worker scheduling
        run: node tests/economic-orchestration.cjs
      - name: Verify optimizer and proof claims
        run: node tests/optimization-regression.cjs --json optimization-report.json
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-independent-validation
          path: |
            optimization-report.json
            proof-gaps.json
            nested-kerf-report.json
            triple-threshold-report.json
          if-no-files-found: warn
