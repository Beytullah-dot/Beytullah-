name: Beythaus Cut - Optimizer Verification

on:
  push:
    branches: [master]
    paths:
      - 'docs/index.html'
      - 'docs/engine/**'
      - 'docs/optimization-worker.js'
      - 'docs/constructive-worker.js'
      - 'docs/advanced-search-worker.js'
      - 'docs/guillotine-exact.js'
      - 'docs/economic-exact.js'
      - 'tests/**'
      - '.github/workflows/optimization-verification.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/index.html'
      - 'docs/engine/**'
      - 'docs/optimization-worker.js'
      - 'docs/constructive-worker.js'
      - 'docs/advanced-search-worker.js'
      - 'docs/guillotine-exact.js'
      - 'docs/economic-exact.js'
      - 'tests/**'
      - '.github/workflows/optimization-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-optimization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify module architecture and independent production audit
        run: node tests/engine-contract.cjs
      - name: Verify opt-in multiplicity candidates against independent oracles
        run: CASES=3 node tests/stage2/check.cjs
      - name: Verify independent narrow-scrap physical rules
        run: node tests/narrow-scrap-verifier.cjs
      - name: Verify commercial project generator, independent witnesses and area relaxation
        run: node tests/commercial-stage0/selftest.cjs
      - name: Verify analytical geometric lower bounds
        run: node tests/geometric-bounds.cjs
      - name: Verify heterogeneous 27-sheet kerf bounds and distinct exact objectives
        run: node tests/motor-heterogeneous-capacity.cjs
      - name: Verify positive-kerf mixed-stock physical strip rescue
        run: node tests/motor-mixed-strip.cjs
      - name: Verify nested residual full-edge cuts against planted witnesses
        run: MOTOR_NESTED_JSON=nested-kerf-report.json node tests/motor-nested-residual.cjs
      - name: Verify joint area and large-piece capacity bounds against independent oracles
        run: node tests/motor-paired-cover.cjs
      - name: Verify simultaneous multi-threshold area and cost bounds with independent oracle
        run: node tests/motor-multi-threshold.cjs
      - name: Verify three simultaneous size thresholds and larger independent holdouts
        run: MOTOR_TRIPLE_JSON=triple-threshold-report.json node tests/motor-triple-threshold.cjs
      - name: Verify kerf-expanded area against independent stock oracle and physical exact holdouts
        run: MOTOR_EXPANDED_JSON=kerf-expanded-report.json node tests/motor-kerf-expanded-area.cjs
      - name: Verify independent two-stage guillotine pattern oracle and physical trees
        run: MOTOR_TWO_STAGE_JSON=two-stage-report.json node tests/motor-two-stage-exact.cjs
      - name: Verify independent three-stage VH-V and HV-H nested trees
        run: MOTOR_THREE_STAGE_JSON=three-stage-report.json node tests/motor-three-stage-exact.cjs
      - name: Profile bounded three-stage exact enumeration and isolated Linux RSS
        run: MOTOR_THREE_STAGE_SCALE_JSON=three-stage-scale-report.json node tests/motor-three-stage-scale.cjs
      - name: Verify lazy three-stage physical candidates and exact UNKNOWN comparison
        run: MOTOR_THREE_STAGE_LAZY_JSON=three-stage-lazy-report.json node tests/motor-three-stage-lazy.cjs
      - name: Verify live lazy constructive Worker against independent physical oracle
        run: node tests/constructive-worker.cjs
      - name: Profile deployed bounded constructive Worker with isolated real Linux RSS
        run: MOTOR_LIVE_CONSTRUCTIVE_SCALE_JSON=live-constructive-scale-report.json node tests/motor-live-constructive-scale.cjs
      - name: Measure stratified exact and heuristic capacity (synthetic independent audits)
        run: MOTOR_CAPACITY_JSON=motor-capacity-matrix.json node tests/motor-capacity-matrix.cjs
      - name: Research commercial tight-stock witnesses, scarcity and objective contrast
        run: MOTOR_COMMERCIAL_STRESS_JSON=motor-commercial-stress.json node tests/motor-commercial-tight-stock.cjs
      - name: Verify independent alternate-topology stock-shape holdouts
        run: MOTOR_SHAPE_HOLDOUT_JSON=motor-shape-holdout.json node tests/motor-stock-shape-holdout.cjs
      - name: Verify new physical exact full-span bound in deployed proof worker
        run: MOTOR_FULLSPAN_CERT_JSON=fullspan-certificate-report.json node tests/motor-fullspan-certificate.cjs
      - name: Verify physical stock-geometry compatibility with independent oracle
        run: MOTOR_GEOMETRY_FILTER_JSON=geometry-stock-filter-report.json node tests/motor-geometry-stock-filter.cjs
      - name: Verify mixed-size threshold kerf area and cost lower bounds
        run: node tests/motor-threshold-kerf.cjs
      - name: Verify fractional kerf bounds and unused independent cases
        run: node tests/motor-fractional-oracle.cjs
      - name: Diagnose independent small-job optimum proof gaps
        run: MOTOR_GAP_JSON=proof-gaps.json node tests/motor-proof-gap-census.cjs
      - name: Verify background exact Worker against reference oracle
        run: node tests/optimization-worker.cjs
      - name: Verify exact guillotine cut trees and proofs
        run: node tests/guillotine-worker.cjs
      - name: Verify real atelier PDF has full-length cuts and safe draft marking
        run: node tests/atolye-production-safety.cjs
      - name: Verify gross-area and stock-cost objectives remain independent
        run: node tests/motor-objective-separation.cjs
      - name: Verify user-selected exact objective and audited plan acceptance
        run: node tests/selected-objective-flow.cjs
      - name: Verify exact incremental stock-cost optimum
        run: node tests/economic-worker.cjs
      - name: Validate economic plan acceptance and tamper rejection
        run: node tests/economic-acceptance.cjs
      - name: Verify mobile-friendly sequential Worker scheduling
        run: node tests/economic-orchestration.cjs
      - name: Verify Stage 1 default-off, physical overhang and relaxed lower bounds
        run: |
          node tests/stage1/core.cjs
          node tests/stage1/closure/precision.cjs
          node tests/stage1/closure/default-off.cjs
          node tests/stage1/closure/bounds-relaxed.cjs
          node tests/stage1/closure/missed-diagnosis.cjs
      - name: Verify optimizer and proof claims
        run: node tests/optimization-regression.cjs --json optimization-report.json
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-independent-validation
          path: |
            optimization-report.json
            proof-gaps.json
            nested-kerf-report.json
            triple-threshold-report.json
            kerf-expanded-report.json
            geometry-stock-filter-report.json
            fullspan-certificate-report.json
            two-stage-report.json
            three-stage-report.json
            three-stage-scale-report.json
            three-stage-lazy-report.json
            live-constructive-scale-report.json
            motor-capacity-matrix.json
            motor-commercial-stress.json
            motor-shape-holdout.json
          if-no-files-found: warn
