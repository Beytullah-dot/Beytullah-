name: Beythaus Cut - Optimizer Verification

on:
  push:
    branches: [master]
    paths:
      - 'docs/index.html'
      - 'docs/engine/**'
      - 'docs/optimization-worker.js'
      - 'docs/guillotine-exact.js'
      - 'docs/economic-exact.js'
      - 'tests/**'
      - '.github/workflows/optimization-verification.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/index.html'
      - 'docs/engine/**'
      - 'docs/optimization-worker.js'
      - 'docs/guillotine-exact.js'
      - 'docs/economic-exact.js'
      - 'tests/**'
      - '.github/workflows/optimization-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-optimization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify module architecture and independent production audit
        run: node tests/engine-contract.cjs
      - name: Verify analytical geometric lower bounds
        run: node tests/geometric-bounds.cjs
      - name: Verify fractional kerf bounds and unused independent cases
        run: node tests/motor-fractional-oracle.cjs
      - name: Verify background exact Worker against reference oracle
        run: node tests/optimization-worker.cjs
      - name: Verify exact guillotine cut trees and proofs
        run: node tests/guillotine-worker.cjs
      - name: Verify real atelier PDF has full-length cuts and safe draft marking
        run: node tests/atolye-production-safety.cjs
      - name: Verify exact incremental stock-cost optimum
        run: node tests/economic-worker.cjs
      - name: Validate economic plan acceptance and tamper rejection
        run: node tests/economic-acceptance.cjs
      - name: Verify mobile-friendly sequential Worker scheduling
        run: node tests/economic-orchestration.cjs
      - name: Verify optimizer and proof claims
        run: node tests/optimization-regression.cjs --json optimization-report.json
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-independent-validation
          path: optimization-report.json
          if-no-files-found: warn
