name: Beythaus Cut Geometry Tests
on:
  push:
    branches: [master]
    paths:
      - 'docs/index.html'
      - 'docs/engine/**'
      - 'docs/cloud-inventory.*'
      - 'docs/sw.js'
      - 'supabase/migrations/**'
      - 'tests/**'
      - '.github/workflows/cut-validation.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/engine/**'
      - 'docs/cloud-inventory.*'
      - 'docs/sw.js'
      - 'supabase/migrations/**'
      - 'tests/**'
      - '.github/workflows/cut-validation.yml'
permissions:
  contents: read
jobs:
  regression:
    name: Independent geometry and pricing checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression suite
        run: |
          node tests/engine-contract.cjs
          node tests/motor-proof-foundation.cjs
          node tests/cut-validation.test.cjs
          node tests/cloud-sync.test.cjs
      - name: Verify PostgreSQL permissions and atomic inventory operations
        run: |
          docker run --rm -d --name beythaus-ci-postgres -e POSTGRES_PASSWORD=test postgres:17 >/dev/null
          trap 'docker stop beythaus-ci-postgres >/dev/null 2>&1 || true' EXIT
          # The official Postgres image starts a TEMPORARY server for first-run
          # setup, shuts it down, then starts the final server. pg_isready alone
          # can report ready during that temporary phase (a flaky CI failure).
          # Wait for first-run initialization to finish AND the final server.
          POSTGRES_READY=0
          for i in {1..90}; do
            if docker logs beythaus-ci-postgres 2>&1 | grep -q 'PostgreSQL init process complete; ready for start up.' &&
               docker exec beythaus-ci-postgres pg_isready -U postgres >/dev/null 2>&1; then
              POSTGRES_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGRES_READY" -ne 1 ]; then
            docker logs beythaus-ci-postgres >&2
            echo 'Final PostgreSQL server did not become ready' >&2
            exit 1
          fi
          docker exec -i beythaus-ci-postgres psql -U postgres -v ON_ERROR_STOP=1 < tests/cloud-db-bootstrap.sql
          docker exec -i beythaus-ci-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261118_000001_cloud_inventory.sql
          docker exec -i beythaus-ci-postgres psql -U postgres -v ON_ERROR_STOP=1 < tests/cloud-db-smoke.sql
          docker exec -i beythaus-ci-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261119_000002_full_stock_production.sql
          docker exec -i beythaus-ci-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261122_000003_server_physical_cut_guard.sql
          docker exec -i beythaus-ci-postgres psql -U postgres -v ON_ERROR_STOP=1 < tests/cloud-production-v2-smoke.sql
