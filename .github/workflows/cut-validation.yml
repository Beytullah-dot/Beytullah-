name: Beythaus Cut Geometry Tests
on:
  push:
    branches: [master]
    paths:
      - 'docs/index.html'
      - 'docs/engine/**'
      - 'docs/cloud-inventory.*'
      - 'docs/sw.js'
      - 'supabase/migrations/**'
      - 'tests/**'
      - '.github/workflows/cut-validation.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/engine/**'
      - 'docs/cloud-inventory.*'
      - 'docs/sw.js'
      - 'supabase/migrations/**'
      - 'tests/**'
      - '.github/workflows/cut-validation.yml'
permissions:
  contents: read
jobs:
  regression:
    name: Independent geometry and pricing checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression suite
        run: |
          node tests/cut-validation.test.cjs
          node tests/cloud-sync.test.cjs
      - name: Verify PostgreSQL permissions and atomic inventory operations
        run: |
          docker run --rm -d --name beythaus-ci-postgres -e POSTGRES_PASSWORD=test postgres:17 >/dev/null
          trap 'docker stop beythaus-ci-postgres >/dev/null 2>&1 || true' EXIT
          for i in {1..60}; do
            if docker exec beythaus-ci-postgres pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -i beythaus-ci-postgres psql -U postgres -v ON_ERROR_STOP=1 < tests/cloud-db-bootstrap.sql
          docker exec -i beythaus-ci-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261118_000001_cloud_inventory.sql
          docker exec -i beythaus-ci-postgres psql -U postgres -v ON_ERROR_STOP=1 < tests/cloud-db-smoke.sql
